<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coins Info</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1F4E79; }
    #result { background: #f7f9fc; border: 1px solid #d0dff0; border-radius: 8px; padding: 20px; margin-top: 20px; }
    button { background: #2E75B6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1F4E79; }
  </style>
</head>
<body>

<h1>Coins Info.</h1>
<input type="text" id="coinInput" placeholder="e.g Bitcoin, solana" style="padding:8px; font-size:16px; width:250px;">
<button onclick="loadCoin()">Search</button>
<div id="result">Enter a coin name above and click Search.</div>

<script>
async function loadCoin() {
  const coin = document.getElementById("coinInput").value.trim();

  if (!coin) {
    document.getElementById("result").innerHTML = "Please enter a coin name.";
    return;
  }

  document.getElementById("result").innerHTML = "Please wait... (Loading in Process.)";

  try {
    const response = await fetch(`https://api.coingecko.com/api/v3/coins/${coin.toLowerCase()}`);

    if (!response.ok) {
      throw new Error(`Coin not found (${response.status})`);
    }

    const data = await response.json();

    const desc = data.description.en;

    document.getElementById("result").innerHTML = `
      <h2>${data.name}</h2>
      <p><strong>Description:</strong> ${desc}</p>
    `;
  } catch (error) {
    document.getElementById("result").innerHTML = `Error: ${error.message}`;
  }
}
</script>

</body>
</html>
